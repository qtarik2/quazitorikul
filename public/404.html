<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quazi Torikul Alam || Game Programmer || Portfolio</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // GitHub Pages serves this file for any unknown path. Encode the requested
      // route into a query string and bounce to index.html, where the snippet in
      // index.html restores it via history.replaceState before React Router runs.
      // pathSegmentsToKeep = 1 because the site is served from /quazitorikul/.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
